name: Serve assets on Pages

# Instagram fetches artwork over https, so the assets folder has to be public.
# Everything in assets/ is served at https://omnifitapp.github.io/omnifit-social/

on:
  push:
    branches: [main]
    paths: ["assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets
      - id: deployment
        uses: actions/deploy-pages@v4
